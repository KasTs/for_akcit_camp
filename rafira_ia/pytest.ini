[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Sem isso, "pytest -v" puro (sem "python -m") falha com ModuleNotFoundError
# em app: nada mais coloca a raiz do repo no sys.path — não há
# conftest.py na raiz, tests/ não é um pacote, e o projeto não é instalado
# (sem pyproject.toml/setup.py). É o que o CI roda (ci.yml), então precisa
# funcionar sem depender de "-m".
pythonpath = .
